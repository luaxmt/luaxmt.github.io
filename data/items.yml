# title : "Items"
# content: |
#   This is an <strong>Items</strong> element, and it's basically just a grid for organizing items of various types. You can customize its <span class="demo-controls">appearance with a number of modifiers</span>, as well as assign it an optional <code>onload</code> or <code>onscroll</code> transition modifier (<a href="#reference-items">details</a>).
style: "style1 medium onscroll-fade-in"
items:
  # feature item loop
  - name : "Modalidade"
    content : "Atendimentos presenciais em Porto Alegre–RS, no bairro Petrópolis, ou online, por videochamada ou ligação telefônica."
    style : "solid style2 major fa-location-dot"

  # feature item loop
  - name : "Frequência"
    content : "Definida a partir de cada caso e da condução do processo terapêutico. Em geral, os atendimentos são semanais, podendo ser ajustados conforme a necessidade clínica."
    style : "solid style2 major fa-hourglass-half"
    
  # feature item loop
  - name : "Sigilo e vínculo terapêutico"
    content : "O sigilo profissional é um princípio ético fundamental da prática clínica. A confidencialidade do que é compartilhado em sessão é parte do que sustenta um espaço de fala seguro, no qual é possível elaborar questões com liberdade."
    style : "solid style2 major fa-key"