title : "Sobre"
content : |
  Olá! Sou a Luana. Sou psicóloga clínica, graduada pela Universidade Federal do Rio Grande do Sul (UFRGS). Minha prática clínica se orienta pela psicanálise contemporânea e se constrói a partir da escuta das vivências de mulheres e de pessoas LGBTQIAP+, considerando os atravessamentos de raça, classe, gênero e sexualidade na constituição do sofrimento psíquico.
  <br />
  <br />  
  Sou especialista em Saúde Mental pelo Programa de Residência Multiprofissional da Universidade do Vale do Rio dos Sinos (Unisinos) e, atualmente, mestranda pelo Programa de Pós-Graduação em Psicologia Social da UFRGS.
  <br />
  <br />
  Ao longo da minha trajetória, atuei em diferentes contextos clínicos e institucionais, incluindo serviços multiprofissionais nas políticas públicas voltados ao cuidado da população trans, travesti e não-binária, bem como de suas comunidades e familiares. Também sou membra-fundadora da Associação Projeto Gradiva, coletivo clínico feminista que oferece atendimento em saúde mental para mulheres em situação de violência de gênero.
  <br />
  <br />
  Tenho experiência no acompanhamento e condução de situações de crise, bem como no tratamento do luto, da ansiedade e da depressão. Mantenho-me em constante atualização profissional, buscando proporcionar um espaço terapêutico seguro, acolhedor e comprometido com  uma escuta ética, sensível e sem julgamentos.
  <br />
  <br />
  Atendo como psicóloga em Porto Alegre (RS), e também ofereço atendimentos psicológicos online, acompanhando jovens a partir dos 14 anos, adultos e idosos.
